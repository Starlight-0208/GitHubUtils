name: Auto update
on: push

jobs:
    update-repo:
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            - name: Install dependencies
              run: |
                pip install -r requirements.txt
            - name: Run the script to fetch data
              run: |
                python programs/main/main.py
            - name: set up Git user
              run: |
                git config user.name "starlight_0208"
                git config user.email "Starlight-0208@users.noreply.github.com"
            - name: add files to git
              run: |
                git add .
            - name: set remote url
              run: |
                git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
            - name: Commit changes
              run: |
                DATE=$(sh -c 'date +"%Y-%m-%d"')
                git commit -m "$DATE updated"
            - name: Push changes
              run: |
                git push